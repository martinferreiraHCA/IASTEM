# Trae sola, cada pocos minutos, lo que haya de nuevo en la carpeta de Drive
# de la muestra: baja los videos, los pasa a mp4 y los deja publicados en el
# sitio, en orden alfabético. Así, subir un video a la carpeta alcanza.
#
# También se puede correr a mano: pestaña Actions → "Videos de la carpeta" →
# Run workflow.
name: Videos de la carpeta

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: videos-de-la-carpeta
  cancel-in-progress: false

jobs:
  traer:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: ¿Cambió la carpeta?
        id: carpeta
        run: |
          set +e
          node herramientas/videos.mjs --comprobar
          echo "codigo=$?" >> "$GITHUB_OUTPUT"

      - name: Instalar ffmpeg
        if: steps.carpeta.outputs.codigo == '3'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Traer los videos
        if: steps.carpeta.outputs.codigo == '3'
        run: node herramientas/videos.mjs

      - name: Publicar
        if: steps.carpeta.outputs.codigo == '3'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Solo se tocan los videos y su índice: nada más del repositorio.
          git add public/videos
          if git diff --cached --quiet; then echo "Nada para publicar."; exit 0; fi
          git commit -m "Videos de la carpeta de Drive, al día"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          # Las tres ramas van juntas: la que publica el sitio, main y la de trabajo.
          # Siempre hacia adelante: si una rama tiene algo distinto, no se la pisa.
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
          for rama in main claude/ai-web-interface-api-yp4ekl claude/clever-rubin-64cgy9; do
            [ "$rama" = "${GITHUB_REF_NAME}" ] && continue
            git push origin "HEAD:refs/heads/$rama" || echo "::warning::No se pudo adelantar la rama $rama"
          done

# Publica la carpeta public/ en GitHub Pages en cada push a la rama principal.
#
# Para activarlo, una sola vez:
#   Settings → Pages → Source → GitHub Actions
#
# Ojo: lo que se publica es un sitio público. Nunca pongas la API key en el
# código; se carga desde el botón "Conexión" y queda en el navegador de cada uno.

name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Preparar Pages
        uses: actions/configure-pages@v5

      - name: Empaquetar el sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4

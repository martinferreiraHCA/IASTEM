<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NOVA · IASTEM</title>
  <!--
    La página vive en public/. Este archivo existe para que el sitio funcione
    también cuando Pages está configurado como "Deploy from a branch", que
    sirve la raíz del repositorio.

    Si en Settings → Pages ponés Source → GitHub Actions, el workflow publica
    public/ directamente, la dirección queda más corta y este archivo deja de
    usarse. Se puede borrar entonces.
  -->
  <meta http-equiv="refresh" content="0; url=./public/" />
  <link rel="canonical" href="./public/" />
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #05060c;
      color: #9aa3c7;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      text-align: center;
    }
    .cargando { display: grid; gap: 22px; justify-items: center; padding: 24px; }
    .orbe {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      background: conic-gradient(from 0deg, #7af5ff, #a37bff, #ff6ec7, #7af5ff);
      animation: girar 1.6s linear infinite;
    }
    @keyframes girar { to { transform: rotate(360deg); } }
    p { margin: 0; font-size: 15px; line-height: 1.6; }
    a { color: #7af5ff; }
    @media (prefers-reduced-motion: reduce) { .orbe { animation: none; } }
  </style>
</head>
<body>
  <div class="cargando">
    <div class="orbe"></div>
    <p>Abriendo NOVA… <br /><a href="./public/">Entrar</a></p>
  </div>
</body>
</html>
